<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVANT Hub — Publicar versão</title>
<style>
:root{--pri:#14C8A0;--bg:#0f1115;--panel:#181b21;--line:#2a2f38;--tx:#eef1f5;--tx2:#9aa3b2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
.card{width:min(520px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{font-size:22px;margin:0 0 6px}p{color:var(--tx2);margin:6px 0 16px}label{display:block;margin:14px 0 6px;font-size:14px;color:var(--tx2)}
input[type=file],textarea{width:100%;background:#0f1115;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
button{background:var(--pri);color:#04110d;border:0;border-radius:10px;padding:12px 18px;font:600 15px system-ui;cursor:pointer;width:100%;margin-top:16px}
button:disabled{opacity:.5;cursor:default}.msg{margin-top:14px;font-size:14px;white-space:pre-line}.ok{color:var(--pri)}.err{color:#ff7a7a}
.bar{height:8px;background:#0f1115;border-radius:6px;overflow:hidden;margin-top:12px;display:none}.bar i{display:block;height:100%;width:0;background:var(--pri)}
</style></head><body>
<div class="card">
  <h1>Publicar versão</h1>
  <p id="who">Entre com a conta de administrador.</p>
  <button id="login">Entrar com Google</button>
  <div id="panel" hidden>
    <label>Pacote (AVANT-Hub.zip)</label><input type="file" id="file" accept=".zip">
    <label>O que mudou (aparece para o pessoal)</label><textarea id="notes" rows="4" placeholder="Ex.: novas ferramentas no AVANTools, correções"></textarea>
    <label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx)"><input type="checkbox" id="full" checked style="margin-top:4px"><span>Incluir também o pacote completo (necessário enquanto alguém ainda estiver na 7.14 ou antes; depois pode desmarcar para publicar mais rápido)</span></label>
    <button id="send">Publicar</button>
    <div class="bar" id="bar"><i></i></div>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, deleteDoc, Bytes } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyCYe4xuoxPTxrATPui_2UJCKVIE92XYkDA", authDomain: "avant-hub-c7f41.firebaseapp.com", projectId: "avant-hub-c7f41",
  storageBucket: "avant-hub-c7f41.firebasestorage.app", messagingSenderId: "851305378186", appId: "1:851305378186:web:6e9f3385f019ba446c9873"
});
const auth = getAuth(app), db = getFirestore(app), $ = s => document.querySelector(s);
const say = (t, c) => { $("#msg").textContent = t; $("#msg").className = "msg " + (c || ""); };
const CHUNK = 700000;
onAuthStateChanged(auth, u => { $("#panel").hidden = !u; $("#login").hidden = !!u; if (u) $("#who").textContent = "Conectado como " + u.email; });
$("#login").onclick = async () => { try { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" }); await signInWithPopup(auth, p); } catch (e) { say("Erro: " + (e.code || e.message), "err"); } };
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
$("#send").onclick = async () => {
  const f = $("#file").files[0]; if (!f) return say("Escolha o arquivo .zip.", "err");
  $("#send").disabled = true; $("#bar").style.display = "block"; const bar = $("#bar i");
  try {
    say("Lendo o pacote…");
    const buf = await f.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const names = Object.keys(zip.files);
    const mf = names.find(n => /(^|\/)manifest\.json$/.test(n) && n.split("/").length <= 2);
    if (!mf) throw new Error("O zip não tem manifest.json.");
    const man = JSON.parse(await zip.file(mf).async("string"));
    if (man.name !== "AVANT Hub") throw new Error("Esse zip não parece ser do AVANT Hub.");
    const sha = hex(await crypto.subtle.digest("SHA-256", buf));
    const rid = Date.now().toString(36), full = $("#full").checked, n = full ? Math.ceil(buf.byteLength / CHUNK) : 0;
    let old = null; try { const s = await getDoc(doc(db, "releases", "latest")); if (s.exists()) old = s.data(); } catch {}
    let oldFiles = {}; try { if (old && old.manifest) oldFiles = JSON.parse(old.manifest); } catch {}
    const root = mf.includes("/") ? mf.slice(0, mf.lastIndexOf("/") + 1) : "";
    // 1) cada arquivo: sha256 do conteúdo, comprimido e cortado em partes. Só sobe o que ainda não existe.
    say("Conferindo o que mudou…");
    const files = {}, toSend = []; const zn = names.filter(x => !zip.files[x].dir);
    for (const nm of zn) {
      const u8 = await zip.file(nm).async("uint8array"), rel = nm.slice(root.length), fs = hex(await crypto.subtle.digest("SHA-256", u8));
      const was = oldFiles[rel];
      if (was && was[0] === fs) { files[rel] = was; continue; }
      const z = new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
      const cnt = Math.max(1, Math.ceil(z.length / CHUNK)); files[rel] = [fs, cnt, u8.length]; toSend.push({ fs, z, cnt });
    }
    const jobs = []; for (const t of toSend) for (let i = 0; i < t.cnt; i++) jobs.push({ t, i });
    let done = 0, total = jobs.length + n;
    const tick = () => { done++; bar.style.width = (done / Math.max(1, total) * 100) + "%"; say(`Enviando… ${done}/${total}\n${toSend.length} arquivo(s) novo(s) ou alterado(s), ${Object.keys(files).length - toSend.length} iguais ao anterior.`); };
    const run3 = async list => { await Promise.all([0, 1, 2].map(async () => { while (list.length) await list.shift()(); })); };
    await run3(jobs.map(j => async () => {
      const part = j.t.z.subarray(j.i * CHUNK, Math.min(j.t.z.length, (j.i + 1) * CHUNK));
      await setDoc(doc(db, "parts", "f_" + j.t.fs.slice(0, 32) + "_" + j.i), { i: j.i, data: Bytes.fromUint8Array(part) }); tick();
    }));
    // 2) pacote completo (para quem ainda está numa versão antiga)
    if (full) await run3([...Array(n).keys()].map(i => async () => {
      const part = new Uint8Array(buf, i * CHUNK, Math.min(CHUNK, buf.byteLength - i * CHUNK));
      await setDoc(doc(db, "parts", rid + "_" + i), { rid, i, data: Bytes.fromUint8Array(part) }); tick();
    }));
    await setDoc(doc(db, "releases", "latest"), { version: man.version, sha256: full ? sha : "", notes: $("#notes").value.trim(), size: buf.byteLength, parts: n, rid: full ? rid : "", at: Date.now(), manifest: JSON.stringify(files) });
    // 3) limpeza do que ficou sem uso
    if (old && old.rid && old.parts) { for (let i = 0; i < old.parts; i++) await deleteDoc(doc(db, "parts", old.rid + "_" + i)).catch(() => {}); }
    const live = new Set(Object.values(files).map(v => v[0]));
    for (const v of Object.values(oldFiles)) if (!live.has(v[0])) { live.add(v[0]); for (let i = 0; i < v[1]; i++) await deleteDoc(doc(db, "parts", "f_" + v[0].slice(0, 32) + "_" + i)).catch(() => {}); }
    say(`Publicado: versão ${man.version}. Subiram ${toSend.length} arquivo(s) de ${Object.keys(files).length}${full ? ", mais o pacote completo" : ""}.\nO pessoal vê o aviso no hub em até 6 horas, ou na hora ao clicar em “Verificar agora”.`, "ok");
  } catch (e) { say("Não deu certo: " + (e.code || e.message || e), "err"); }
  $("#send").disabled = false;
};
</script></body></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVANT Hub — Entrar</title>
<style>
:root{--pri:#14C8A0;--bg:#0f1115;--panel:#181b21;--line:#2a2f38;--tx:#eef1f5;--tx2:#9aa3b2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
.card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;text-align:center}
h1{font-size:22px;margin:0 0 6px}p{color:var(--tx2);margin:6px 0 20px}
button{background:var(--pri);color:#04110d;border:0;border-radius:10px;padding:12px 18px;font:600 15px system-ui;cursor:pointer;width:100%}
button:disabled{opacity:.5;cursor:default}.msg{margin-top:16px;font-size:14px;min-height:20px}.ok{color:var(--pri)}.err{color:#ff7a7a}
</style></head><body>
<div class="card">
  <h1>AVANT Hub</h1>
  <p>Entre com o seu e-mail da AVANT para receber as atualizações.</p>
  <button id="go">Entrar com Google</button>
  <div class="msg" id="msg"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const app = initializeApp({
  apiKey: "AIzaSyCYe4xuoxPTxrATPui_2UJCKVIE92XYkDA", authDomain: "avant-hub-c7f41.firebaseapp.com", projectId: "avant-hub-c7f41",
  storageBucket: "avant-hub-c7f41.firebasestorage.app", messagingSenderId: "851305378186", appId: "1:851305378186:web:6e9f3385f019ba446c9873"
});
const auth = getAuth(app), $ = s => document.querySelector(s);
const ext = new URLSearchParams(location.search).get("ext") || "";
const DOMAIN = "@avantenergia.com.br", ADMINS = ["marioviniciussm@gmail.com"];
const say = (t, c) => { $("#msg").textContent = t; $("#msg").className = "msg " + (c || ""); };
if (!/^[a-p]{32}$/.test(ext)) { say("Abra esta página pelo botão “Entrar” dentro do AVANT Hub.", "err"); $("#go").disabled = true; }
$("#go").onclick = async () => {
  $("#go").disabled = true; say("Abrindo o login…");
  try {
    const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account", hd: "avantenergia.com.br" });
    const { user } = await signInWithPopup(auth, p);
    const mail = (user.email || "").toLowerCase();
    if (!user.emailVerified || !(mail.endsWith(DOMAIN) || ADMINS.includes(mail))) {
      await signOut(auth); say("Use o e-mail da AVANT (" + DOMAIN + ").", "err"); $("#go").disabled = false; return;
    }
    if (!(window.chrome && chrome.runtime && chrome.runtime.sendMessage)) { say("Abra esta página no navegador onde o AVANT Hub está instalado (Opera, Chrome ou Edge).", "err"); $("#go").disabled = false; return; }
    chrome.runtime.sendMessage(ext, { type: "avt-auth", email: mail, refreshToken: user.refreshToken }, r => {
      if (chrome.runtime.lastError || !r || !r.ok) { say("Não consegui falar com o AVANT Hub. Confira se a extensão está ligada e atualizada.", "err"); $("#go").disabled = false; return; }
      say("Pronto, " + mail + ". Pode fechar esta aba e voltar ao hub.", "ok");
    });
  } catch (e) { say(e.code === "auth/popup-closed-by-user" ? "Login cancelado." : "Erro: " + (e.code || e.message), "err"); $("#go").disabled = false; }
};
</script></body></html>
